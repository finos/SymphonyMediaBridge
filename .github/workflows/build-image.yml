name: Build & Push SMB image

# Builds the root Dockerfile (multi-stage: from-source toolchain + Release smb)
# and pushes the runtime image to GHCR under this repository's namespace.
#
# Triggers on the default branch, which in this fork is `master` -- upstream
# never renamed it to `main`, and a `branches: [main]` filter would simply never
# match, leaving the workflow silently dead.
#
# No `pull_request` trigger on purpose: this is a from-source build of OpenSSL,
# CMake, LLVM and SMB itself, so a run costs the better part of an hour even
# warm. pr-unit-test.yml already gates PRs; use workflow_dispatch to build an
# image off a branch on demand.

on:
  push:
    branches: [master]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# One build per ref. A push landing on top of a running build makes the older
# run's image obsolete before it finishes publishing.
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # The toolchain compiles from source; a cold cache runs long.
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Default shallow checkout is enough: version/CheckGit.cmake only runs
        # `git log -1 --format=%h`. .git must exist in the build context, which
        # is why .dockerignore deliberately does not list it.

      # The builder stage unpacks a full LLVM toolchain and builds OpenSSL and
      # CMake from source. A stock runner does not reliably have room for that
      # on top of its preinstalled SDKs.
      - name: Free disk space
        shell: bash
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -af || true
          echo "After:"; df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image name and tags
        id: meta
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # github.repository rather than a literal: a GHCR package does not
          # follow a repository rename, so a literal would keep publishing under
          # the old name. It must be lowercased -- this repo is
          # `qvest-digital/SymphonyMediaBridge`, and GHCR rejects uppercase in an
          # image path, so passing ${{ github.repository }} through unchanged
          # (as a lowercase-named repo can get away with) fails the push here.
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

          # sha tag always; version tag on a release. github.event.release.tag_name
          # is reliable on `release` events (GITHUB_REF is not). Image tags omit
          # the leading `v` (Docker convention).
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          if [[ -n "$RELEASE_TAG" ]]; then
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}
            ${{ steps.meta.outputs.version && format('{0}:{1}', steps.meta.outputs.image, steps.meta.outputs.version) || '' }}
            ${{ github.ref == 'refs/heads/master' && format('{0}:latest', steps.meta.outputs.image) || '' }}
          # mode=max keeps the builder-stage toolchain layers, which are the
          # expensive ones to rebuild. They may exceed the 10 GB per-repo GHA
          # cache ceiling and get evicted; that costs a slow rebuild, not a
          # failure.
          cache-from: type=gha,scope=smb
          cache-to: type=gha,scope=smb,mode=max

      - name: Summary
        shell: bash
        run: |
          echo "Pushed ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.sha }}" >> "$GITHUB_STEP_SUMMARY"
